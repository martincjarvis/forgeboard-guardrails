# cspell:ignore PYTHONUTF
# Fix 9a — the refusal-proof contract (docs/standards/guardrails/
# cross-gate-rules.md: "Every blocking check proves it refuses"). Runs at gate
# 7 (on demand, and wired into `npm run gate:7`) and here in CI — never per
# commit, because this guards a wiring defect and wiring changes only when
# wiring changes.
#
# A "does not refuse" verdict (scripts/check-refusal-proofs.mjs exits 2) is a
# decorative check: a real defect, so this job fails the build. A "no fixture"
# verdict is an audit gap, reported but not build-breaking on its own — see
# the script's own comment for why the two are not the same severity.
name: Refusal-proof audit

on:
  schedule:
    - cron: "0 7 * * 1" # weekly: wiring changes far less often than code does
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refusal-proof-audit:
    name: refusal-proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install semgrep and lizard
        # Same reasoning as pull-request.yml: ADR-0002, resolved from PATH,
        # installed here rather than bundled.
        run: pip install semgrep lizard

      - name: Install dependencies
        run: npm ci

      - name: Audit every blocking check for a negative fixture
        env:
          PYTHONUTF8: "1"
        run: node scripts/check-refusal-proofs.mjs
